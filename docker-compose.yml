services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      # - "9092:9092"  # Commented out due to port conflict
      - "29092:29092"
    environment:
      KAFKA_KRAFT_CLUSTER_ID: "kraft-cluster-id-1234"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Two listeners: internal for container-to-container, external for host machine
      # Internal (container) listener uses 29092 so services inside the compose can reach Kafka via kafka:29092
      # External (host) listener uses 9092 so host clients can connect to localhost:9092
      KAFKA_LISTENERS: "CONTROLLER://0.0.0.0:9091,INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092"

      # Advertise internal as the docker host (kafka:29092) and external as localhost:9092
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9091"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      # inside the container the internal listener is now on 29092
      test: ["CMD", "nc", "-z", "localhost", "29092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - payvo-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=localCluster
      # Kafka UI runs in the compose network and should talk to the container-internal listener
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - payvo-network

volumes:
  kafka_data:

networks:
  payvo-network:
