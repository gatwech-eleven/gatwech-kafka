name: Kafka E2E Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kafka-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      zookeeper:
        image: zookeeper:3.8
        ports:
          - 2181:2181

      kafka:
        image: wurstmeister/kafka:2.13-2.8.1
        ports:
          - 9092:9092
        env:
          KAFKA_ADVERTISED_HOST_NAME: localhost
          KAFKA_ADVERTISED_PORT: 9092
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_CREATE_TOPICS: "test-topic:1:1"
        options: >-
          --health-cmd "nc -z localhost 9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: |
          # Prefer pnpm if a pnpm lockfile exists
          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found — running pnpm install --frozen-lockfile"
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "npm lockfile found — running npm ci"
            npm ci
          else
            echo "No lockfile found — running npm install"
            npm install
          fi

      - name: Debug repo layout
        run: |
          pwd
          ls -la
          ls -la src || true
          ls -la src/client || true

      - name: Assert required files exist
        run: |
          test -f src/client/kafka-client.ts && echo "OK: src/client/kafka-client.ts" || (echo "Missing src/client/kafka-client.ts" && exit 1)
          test -f e2e/run-e2e.ts && echo "OK: e2e/run-e2e.ts" || (echo "Missing e2e/run-e2e.ts" && exit 1)

      - name: Wait for Kafka readiness
        run: |
          echo "Waiting for Kafka to be healthy..."
          for i in {1..30}; do
            if nc -z localhost 9092; then
              echo "Kafka is up!"
              break
            fi
            echo "Retrying in 2s..."
            sleep 2
          done

      - name: Run E2E Kafka Test
        env:
          KAFKA_BOOTSTRAP: localhost:9092
        run: |
          echo "Starting Kafka E2E test"
          pnpm dlx tsx e2e/run-e2e.ts

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-logs
          path: /tmp/kafka*

      - name: Teardown
        if: always()
        run: docker ps -a && docker logs $(docker ps -q --filter "ancestor=wurstmeister/kafka:2.13-2.8.1") || true
