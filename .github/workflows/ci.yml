name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate

      - name: Start Redpanda (Kafka) service
        run: |
          # Allocate slightly more resources in CI so the broker can start reliably
          docker run -d --name redpanda -p 9092:9092 -p 9644:9644 \
            redpandadata/redpanda:v24.1.11 \
            redpanda start \
              --overprovisioned \
              --smp 2 \
              --memory 1024M \
              --reserve-memory 128M \
              --node-id 0 \
              --check=false \
              --kafka-addr PLAINTEXT://0.0.0.0:9092 \
              --advertise-kafka-addr PLAINTEXT://127.0.0.1:9092 \
              --rpc-addr 0.0.0.0:33145 \
              --advertise-rpc-addr 127.0.0.1:33145

      - name: Wait for Redpanda to be ready
        run: |
          echo "Waiting for Redpanda (broker) to become healthy (will try up to 4 minutes)..."
          # Increase attempts to allow slow CI VMs to start the broker
          attempts=180
          attempt=1
          while [ $attempt -le $attempts ]; do
            if docker exec redpanda rpk cluster health --api-urls localhost:9644 >/dev/null 2>&1; then
              echo "Redpanda is healthy (attempt=$attempt)";
              exit 0
            fi
            echo "Redpanda not healthy yet (attempt=$attempt/$attempts). Sleeping 2s..."
            sleep 2
            attempt=$((attempt+1))
          done
          echo "Redpanda did not become healthy in time after ${attempts} attempts";
          echo "--- redpanda container logs ---";
          docker logs redpanda || true;
          echo "--- end redpanda logs ---";
          # Show short process list and netstat to help debug in CI
          docker exec redpanda ps aux || true
          docker exec redpanda netstat -lntp || true
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke E2E
        env:
          KAFKA_BOOTSTRAP: 127.0.0.1:9092
        run: pnpm run test:e2e:smoke
