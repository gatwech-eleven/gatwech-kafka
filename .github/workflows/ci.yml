name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    defaults:
      run:
        working-directory: packages/kafka
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: packages/kafka
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate

      - name: Start Redpanda (Kafka) service
        run: |
          docker run -d --name redpanda -p 9092:9092 -p 9644:9644 \
            redpandadata/redpanda:v24.1.11 \
            redpanda start \
              --overprovisioned \
              --smp 1 \
              --memory 512M \
              --reserve-memory 0M \
              --node-id 0 \
              --check=false \
              --kafka-addr PLAINTEXT://0.0.0.0:9092 \
              --advertise-kafka-addr PLAINTEXT://localhost:9092 \
              --rpc-addr 0.0.0.0:33145 \
              --advertise-rpc-addr localhost:33145

      - name: Wait for Redpanda to be ready
        run: |
          for i in {1..60}; do
            if docker exec redpanda rpk cluster health --api-urls localhost:9644 >/dev/null 2>&1; then
              echo "Redpanda is healthy"; exit 0; fi; echo "waiting..."; sleep 2; done; \
          echo "Redpanda did not become healthy in time"; docker logs redpanda; exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Smoke E2E
        env:
          KAFKA_BOOTSTRAP: localhost:9092
        run: pnpm run test:e2e:smoke
