name: CI

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Start Docker Containers
        run: |
          docker compose up -d
          echo "Waiting for Kafka to be ready..."
          # Wait for Kafka container to be healthy
          timeout 120 bash -c 'until docker compose ps kafka | grep -q "healthy"; do echo "Waiting for Kafka..."; sleep 2; done' || {
            echo "Kafka failed to become healthy"
            docker compose logs kafka
            exit 1
          }
          echo "Kafka is ready!"

      - name: Verify Kafka connectivity
        run: |
          # Test that we can connect to Kafka from the host
          for i in {1..30}; do
            if nc -z localhost 9092; then
              echo "✅ Kafka is accessible on localhost:9092"
              break
            fi
            echo "Waiting for Kafka port 9092... (attempt $i/30)"
            sleep 2
          done
          nc -z localhost 9092 || (echo "❌ Cannot connect to Kafka" && exit 1)

      - name: Smoke E2E
        env:
          KAFKA_BOOTSTRAP: localhost:9092
        run: pnpm test:e2e:smoke

      - name: Stop Docker Containers
        if: always()
        run: docker compose down
